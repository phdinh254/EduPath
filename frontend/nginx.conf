server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nén asset tĩnh (JS/CSS build ra khá nặng — xem README mục "Giới hạn hiện tại").
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # File asset build ra (index-<hash>.js/css) có tên bất biến theo nội dung —
    # cache dài hạn an toàn, không lo phục vụ nhầm bản cũ sau khi deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html luôn phải fetch lại mới — nó tham chiếu tên file asset đã hash,
    # cache nó sẽ khiến trình duyệt kẹt ở bản build cũ sau khi deploy bản mới.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy sang backend NestJS — cùng origin với frontend nên cookie
    # refreshToken (HttpOnly, SameSite=Lax — xem AuthController) gửi kèm tự
    # nhiên, không cần cấu hình CORS. Backend không có prefix "/api" riêng nên
    # phải bỏ nó đi trước khi chuyển tiếp (khớp rewrite của Vite dev proxy).
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback cho React Router: mọi route không khớp file tĩnh nào (vd.
    # /student/exams/abc sau khi tải lại trang) đều trả về index.html để
    # React Router tự xử lý phía client thay vì Nginx trả 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
